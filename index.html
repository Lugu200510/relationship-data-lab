<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="填写网恋情境，探索联系频率、距离和沟通方式如何改变模拟模型的估计。">
<title>网恋研究所 · 情境测试</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; background:#faf5f3; color:#2d2027; font:15px/1.6 Inter,"Microsoft YaHei","PingFang SC",sans-serif }
  main { width:min(920px,calc(100% - 32px)); margin:38px auto }
  header { margin-bottom:20px }
  header strong { color:#922e50; font-size:13px }
  h1 { margin:5px 0; font-size:clamp(30px,5vw,46px); line-height:1.2; letter-spacing:-.04em }
  p { margin:6px 0; color:#685861 }
  .layout { display:grid; grid-template-columns:1.04fr .96fr; gap:14px; align-items:start }
  .card { padding:clamp(17px,3vw,28px); border:1px solid #eadcdf; border-radius:17px; background:#fffdfc }
  form { display:grid; gap:13px }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  label { display:block; font-size:13px; font-weight:650 }
  select { display:block; margin-top:4px; width:100%; min-height:38px; border:1px solid #e2d1d7; border-radius:8px; background:#fffafa; padding:5px 8px; color:inherit; font:inherit }
  input { accent-color:#9c3155 }
  input[type=range] { display:block; width:100%; margin:7px 0 0 }
  .check { display:flex; align-items:center; gap:8px }
  .reset { justify-self:start; border:1px solid #e6d5db; border-radius:8px; background:white; padding:6px 12px; color:#85294a; font:inherit; cursor:pointer }
  :focus-visible { outline:2px solid #a53a61; outline-offset:3px }
  .result { color:#fff2f6; background:radial-gradient(ellipse at top right,#623048,transparent 70%),#311b2a; border:0 }
  .result p { color:#f1ceda }
  .score { display:block; margin:7px 0 12px; font-size:clamp(54px,9vw,86px); line-height:1; letter-spacing:-.07em; font-variant-numeric:tabular-nums }
  .track { background:#ffffff28; border-radius:99px; height:8px; overflow:hidden; margin-bottom:16px }
  .fill { display:block; height:100%; background:#f2a9bf; border-radius:inherit; transform:scaleX(var(--rate,0)); transform-origin:left; transition:transform .42s ease }
  details { margin-top:15px; border-top:1px solid #ffffff30; padding-top:9px; font-size:13px }
  summary { cursor:pointer }
  @media(max-width:630px) { main { margin-top:22px } .layout { grid-template-columns:1fr } }
  @media(prefers-reduced-motion:reduce) { .fill { transition:none } }
</style>
<main>
  <header><strong>网恋研究所</strong><h1>测测你的网恋情境</h1><p>填写确认关系后第一个月的情况，结果会随输入即时更新。</p></header>
  <div class="layout">
    <form id="quiz" class="card" aria-label="网恋情境测试">
      <div class="pair">
        <label>目标<select name="target"><option value="meeting">线下见面</option><option value="stable">稳定交往</option><option value="marriage" selected>结婚</option></select></label>
        <label>从确认关系起算<select name="months"><option value="12">12 个月内</option><option value="24" selected>24 个月内</option><option value="36">36 个月内</option></select></label>
      </div>
      <label for="contact">每周联系天数 · <output id="days" for="contact">5 天</output></label>
      <input id="contact" name="contact" type="range" min="0" max="7" value="5">
      <label>两地距离<select name="distance"><option value="0">50 公里以内</option><option value="1" selected>51–300 公里</option><option value="2">301–1,000 公里</option><option value="3">超过 1,000 公里</option></select></label>
      <label class="check"><input name="video" type="checkbox" checked>有过视频通话</label>
      <label class="check"><input name="plan" type="checkbox" checked>讨论过未来安排</label>
      <button type="reset" class="reset">重置</button>
    </form>
    <section class="card result" aria-label="情境测试结果">
      <div aria-live="polite" aria-atomic="true"><p id="outcome"></p><strong class="score" id="score">—</strong></div>
      <div class="track" aria-hidden="true"><span class="fill" id="fill"></span></div>
      <p>模拟模型估计，适合比较不同情境。计算假设所选目标在首月末尚未达成。</p>
      <details><summary>怎么算的？</summary><p>模型在模拟样本上训练。逻辑回归把四项输入加权求和，再用 Sigmoid 换算成百分比。稳定交往指见面后连续交往满 6 个月。</p></details>
    </section>
  </div>
  <noscript><p>请启用 JavaScript 运行测试。</p></noscript>
</main>
<script>
  const coefficients = {"meeting":{"12":[-0.16850576762816696,0.2206883969820994,-0.7418819494778415,0.5538522269595347,0.4678215637544393],"24":[-0.39517003282105645,0.2508117421379047,-0.5234377835441174,0.5312630385080381,0.6258807780583866],"36":[-0.3224452484640328,0.225757303484878,-0.5545904957077358,0.6722943770855693,0.597722709241677]},"stable":{"12":[-3.1608307790330086,0.2166403110527959,-0.43391649477732974,0.6971061141533799,0.6601930042088848],"24":[-1.5476102233357285,0.20875037391135232,-0.4582657789779574,0.387069913902955,0.9826453075002709],"36":[-1.7308740573765216,0.2374031241331096,-0.5007909681222646,0.7103044542333936,0.9211977211347327]},"marriage":{"12":[-4.053417103279533,0.05720556732553117,-0.1562668376983236,0.03223483119271631,0.07493032787515075],"24":[-3.108171159102774,0.24327774612638908,-0.6469138136199235,0.7654143739888166,0.8787138644681187],"36":[-2.6824801454774754,0.23882005337828227,-0.6035158504621778,1.000166509347314,0.9499727171268073]}};
  const form = document.getElementById('quiz');
  const fields = form.elements;
  const score = document.getElementById('score');
  function render() {
    const [bias, ...weights] = coefficients[fields.target.value][fields.months.value];
    const inputs = [+fields.contact.value, +fields.distance.value, +fields.video.checked, +fields.plan.checked];
    const z = weights.reduce((sum, weight, i) => sum + weight * inputs[i], bias);
    const probability = 1 / (1 + Math.exp(-z));
    document.getElementById('days').value = `${inputs[0]} 天`;
    document.getElementById('outcome').textContent = `${fields.months.value} 个月内${fields.target.selectedOptions[0].text} · 模拟估计`;
    score.textContent = `${(100 * probability).toFixed(1)}%`;
    document.getElementById('fill').style.setProperty('--rate', probability);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      score.getAnimations().forEach(animation => animation.cancel());
      score.animate([{opacity:.55, transform:'translateY(3px)'}, {opacity:1, transform:'none'}], {duration:220});
    }
  }
  form.addEventListener('input', render);
  form.addEventListener('reset', () => requestAnimationFrame(render));
  render();
</script>
